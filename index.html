<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Album Kỷ Niệm 📔</title>

  <!-- Font chữ viết tay (Caveat) + font chữ thường (Be Vietnam Pro) -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Các trái tim bay trang trí (được JS tạo ra) -->
  <div class="hearts" id="hearts"></div>

  <!-- ==================== TIÊU ĐỀ ==================== -->
  <header class="top">
    <h1>Album Kỷ Niệm</h1>
    <p class="top-sub">Nơi cất giữ những khoảnh khắc đáng nhớ ✨</p>
    <div class="stats">
      <span>📷 <b id="statTong">0</b> ảnh</span>
      <span>👫 <b id="statChung">0</b> chụp chung</span>
      <span>🧍 <b id="statRieng">0</b> ảnh em</span>
    </div>
  </header>

  <div class="layout">

    <!-- ==================== FORM THÊM KỶ NIỆM (trang giấy kẻ dòng) ==================== -->
    <aside class="notebook">
      <div class="spiral"></div>

      <h2>Thêm kỷ niệm mới</h2>

      <form id="formKyNiem">

        <!-- 1. Chọn loại album -->
        <label class="field-label">Ảnh thuộc album nào?</label>
        <div class="type-pick">
          <label class="type-card">
            <input type="radio" name="loai" value="chung" checked />
            <span>👫<br />Ảnh chụp chung</span>
          </label>
          <label class="type-card">
            <input type="radio" name="loai" value="mot-minh" />
            <span>🧍<br />Ảnh em</span>
          </label>
        </div>

        <!-- 2. Chọn ảnh -->
        <label class="field-label">Chọn ảnh</label>
        <label class="dropzone" id="dropzone">
          <input type="file" id="inputAnh" accept="image/*" hidden />
          <img id="preview" alt="Xem trước ảnh" hidden />
          <span id="dropText">🖼 Bấm để chọn ảnh từ máy / thư viện<br /><small>hoặc kéo thả ảnh vào đây</small></span>
        </label>

        <!-- Chụp ảnh trực tiếp bằng camera (dùng trên điện thoại) -->
        <button type="button" class="btn-camera" id="btnCamera">📷 Chụp ảnh bằng camera</button>
        <input type="file" id="inputCamera" accept="image/*" capture="environment" hidden />

        <!-- 3. Tên kỷ niệm -->
        <label class="field-label" for="inputTen">Tên kỷ niệm</label>
        <input type="text" id="inputTen" maxlength="60" placeholder="VD: Chuyến đi Đà Lạt" required />

        <!-- 4. Ngày chụp -->
        <label class="field-label" for="inputNgay">Ngày chụp ảnh</label>
        <input type="date" id="inputNgay" required />

        <!-- 5. Ghi chú -->
        <label class="field-label" for="inputGhiChu">Ghi chú</label>
        <textarea id="inputGhiChu" rows="4" maxlength="500" placeholder="Hôm đó chúng mình đã..."></textarea>

        <button type="submit" class="btn-dan">📌 Dán vào album</button>
      </form>
    </aside>

    <!-- ==================== KHU VỰC ALBUM ==================== -->
    <main class="album">

      <!-- Tab chọn album -->
      <div class="tabs" id="tabs">
        <button class="tab active" data-loai="tat-ca">📚 Tất cả</button>
        <button class="tab" data-loai="chung">👫 Ảnh chụp chung</button>
        <button class="tab" data-loai="mot-minh">🧍 Ảnh em</button>
      </div>

      <!-- Bộ lọc tháng / năm -->
      <div class="filter">
        <span>🔎 Tìm lại ảnh cũ:</span>
        <select id="locThang">
          <option value="">Tất cả các tháng</option>
        </select>
        <select id="locNam">
          <option value="">Tất cả các năm</option>
        </select>
        <button class="btn-reset" id="btnReset">Xóa lọc</button>
      </div>

      <!-- Sao lưu / khôi phục: chuyển album giữa điện thoại và máy tính -->
      <div class="backup">
        <span class="backup-note">💡 Ảnh được lưu ngay trên thiết bị này. Muốn chuyển sang thiết bị khác, hãy sao lưu rồi khôi phục.</span>
        <div class="backup-btns">
          <button type="button" class="btn-backup" id="btnSaoLuu">💾 Sao lưu album</button>
          <button type="button" class="btn-backup" id="btnKhoiPhuc">📥 Khôi phục từ file</button>
          <input type="file" id="inputKhoiPhuc" accept=".json,application/json" hidden />
        </div>
      </div>

      <!-- Nơi hiển thị các ảnh -->
      <div class="grid" id="grid"></div>

      <!-- Hiện khi chưa có ảnh nào -->
      <div class="empty" id="empty" hidden>
        <div class="empty-icon">📭</div>
        <p id="emptyText">Album còn trống. Hãy thêm kỷ niệm đầu tiên nhé!</p>
      </div>
    </main>
  </div>

  <!-- ==================== XEM ẢNH LỚN (Lightbox) ==================== -->
  <div class="lightbox" id="lightbox" hidden>
    <div class="lb-card">
      <button class="lb-close" id="lbClose" title="Đóng">✕</button>
      <img id="lbImg" alt="" />
      <div class="lb-info">
        <span class="lb-tag" id="lbTag"></span>
        <h3 id="lbTen"></h3>
        <p class="lb-date" id="lbNgay"></p>
        <p class="lb-note" id="lbGhiChu"></p>
        <button class="btn-xoa" id="lbXoa">🗑 Xóa kỷ niệm này</button>
      </div>
    </div>
  </div>

  <!-- Thông báo nhỏ -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
